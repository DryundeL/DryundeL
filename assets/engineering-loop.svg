<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="274" viewBox="0 0 1200 274" role="img" aria-label="Discover, design, build, review, ship — an animated engineering loop"><title>Discover, design, build, review, ship — an animated engineering loop</title><defs><linearGradient id="bg"><stop stop-color="#081623"/><stop offset="1" stop-color="#1b1231"/></linearGradient><linearGradient id="neon"><stop stop-color="#50eadc"/><stop offset="1" stop-color="#b88bff"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#6f8db2" stroke-opacity=".06"/></pattern></defs><style>text{font-family:Consolas,Monaco,monospace}.sans{font-family:Arial,Helvetica,sans-serif}.muted{fill:#9cb0cc}.flow{stroke-dasharray:5 10;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{animation:orbit 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-90}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}.step{animation:step 10s ease-in-out infinite}@keyframes step{0%,20%,100%{stroke:#50eadc;stroke-width:2}24%,96%{stroke:#3b3558;stroke-width:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="274" rx="16" fill="url(#bg)"/><rect width="1200" height="274" rx="16" fill="url(#grid)"/><text x="26" y="33" font-size="12" letter-spacing="3" fill="#9cb0cc">ENGINEERING LOOP / FROM INTENT TO PRODUCTION</text><g transform="translate(26 70)"><rect width="208" height="115" rx="12" fill="#0b1525" stroke="#8f78c0" class="step" style="animation-delay:0s"/><text x="18" y="27" fill="#50eadc" font-size="12">01</text><text x="18" y="58" fill="#ecf2ff" font-size="19">DISCOVER</text><text x="18" y="88" fill="#a4bad5" font-size="12">workflow + access</text><path d="M210 58H232m-7-5 7 5-7 5" fill="none" stroke="#50eadc" class="pulse"/></g><g transform="translate(261 70)"><rect width="208" height="115" rx="12" fill="#0b1525" stroke="#8f78c0" class="step" style="animation-delay:-2s"/><text x="18" y="27" fill="#50eadc" font-size="12">02</text><text x="18" y="58" fill="#ecf2ff" font-size="19">DESIGN</text><text x="18" y="88" fill="#a4bad5" font-size="12">data + contracts</text><path d="M210 58H232m-7-5 7 5-7 5" fill="none" stroke="#50eadc" class="pulse"/></g><g transform="translate(496 70)"><rect width="208" height="115" rx="12" fill="#0b1525" stroke="#8f78c0" class="step" style="animation-delay:-4s"/><text x="18" y="27" fill="#50eadc" font-size="12">03</text><text x="18" y="58" fill="#ecf2ff" font-size="19">BUILD</text><text x="18" y="88" fill="#a4bad5" font-size="12">modules + tests</text><path d="M210 58H232m-7-5 7 5-7 5" fill="none" stroke="#50eadc" class="pulse"/></g><g transform="translate(731 70)"><rect width="208" height="115" rx="12" fill="#0b1525" stroke="#8f78c0" class="step" style="animation-delay:-6s"/><text x="18" y="27" fill="#50eadc" font-size="12">04</text><text x="18" y="58" fill="#ecf2ff" font-size="19">REVIEW</text><text x="18" y="88" fill="#a4bad5" font-size="12">SQL + edge cases</text><path d="M210 58H232m-7-5 7 5-7 5" fill="none" stroke="#50eadc" class="pulse"/></g><g transform="translate(966 70)"><rect width="208" height="115" rx="12" fill="#0b1525" stroke="#8f78c0" class="step" style="animation-delay:-8s"/><text x="18" y="27" fill="#50eadc" font-size="12">05</text><text x="18" y="58" fill="#ecf2ff" font-size="19">SHIP</text><text x="18" y="88" fill="#a4bad5" font-size="12">CI + diagnostics</text></g><path d="M1127 195v23H130v-23" fill="none" stroke="#8e70c8" class="flow"/><text x="600" y="250" text-anchor="middle" font-size="12" fill="#a8b7d2">observe → learn → repeat / small changes, clear contracts</text><path d="M22 273H1178" stroke="url(#neon)" stroke-opacity=".65"/></svg>
