<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-label="Backend, frontend and delivery — connected technology panels"><title>Backend, frontend and delivery — connected technology panels</title><defs><linearGradient id="bg"><stop stop-color="#081623"/><stop offset="1" stop-color="#1b1231"/></linearGradient><linearGradient id="neon"><stop stop-color="#50eadc"/><stop offset="1" stop-color="#b88bff"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#6f8db2" stroke-opacity=".06"/></pattern></defs><style>text{font-family:Consolas,Monaco,monospace}.sans{font-family:Arial,Helvetica,sans-serif}.muted{fill:#9cb0cc}.flow{stroke-dasharray:5 10;animation:flow 3s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.orbit{animation:orbit 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-90}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="326" rx="16" fill="url(#bg)"/><rect width="1200" height="326" rx="16" fill="url(#grid)"/><text x="26" y="32" font-size="12" letter-spacing="3" fill="#9cb0cc">STACK / CONNECTED SYSTEMS</text><path d="M100 56H1100" fill="none" stroke="#6385b1" stroke-opacity=".35"/><path d="M100 56H1100" fill="none" stroke="#50eadc" class="flow"/><g transform="translate(24 74)"><rect width="360" height="230" rx="12" fill="#0b1525" stroke="#50eadc" stroke-opacity=".45"/><path d="M18 1H342" stroke="#50eadc" class="pulse"/><text x="20" y="30" fill="#50eadc" font-size="12" letter-spacing="1">BACKEND / DATA</text><text x="317" y="32" fill="#50eadc" font-size="20" text-anchor="middle">{ }</text><text x="20" y="73" font-size="17" fill="#e6efff">PHP / Laravel / Go</text><text x="20" y="103" font-size="13" fill="#a4b9d3">Echo · chi · Huma</text><text x="20" y="133" font-size="13" fill="#a4b9d3">PostgreSQL · MySQL · Redis</text><text x="20" y="163" font-size="13" fill="#a4b9d3">RabbitMQ · NATS · ClickHouse</text><text x="20" y="193" font-size="13" fill="#a4b9d3">REST · OAuth2 · OpenAPI</text><circle cx="180" cy="-18" r="4" fill="#50eadc" class="pulse" style="animation-delay:-0s"/></g><g transform="translate(420 74)"><rect width="360" height="230" rx="12" fill="#0b1525" stroke="#b88bff" stroke-opacity=".45"/><path d="M18 1H342" stroke="#b88bff" class="pulse"/><text x="20" y="30" fill="#b88bff" font-size="12" letter-spacing="1">FRONTEND / EXPERIENCE</text><text x="317" y="32" fill="#b88bff" font-size="20" text-anchor="middle">&lt;/&gt;</text><text x="20" y="73" font-size="17" fill="#e6efff">React 19 / TypeScript</text><text x="20" y="103" font-size="13" fill="#a4b9d3">FSD · TanStack Query</text><text x="20" y="133" font-size="13" fill="#a4b9d3">Zustand · Vite · Node.js</text><text x="20" y="163" font-size="13" fill="#a4b9d3">SSR · JavaScript · HTML/CSS</text><text x="20" y="193" font-size="13" fill="#a4b9d3">Interfaces + API integration</text><circle cx="180" cy="-18" r="4" fill="#b88bff" class="pulse" style="animation-delay:-1s"/></g><g transform="translate(816 74)"><rect width="360" height="230" rx="12" fill="#0b1525" stroke="#6db9ff" stroke-opacity=".45"/><path d="M18 1H342" stroke="#6db9ff" class="pulse"/><text x="20" y="30" fill="#6db9ff" font-size="12" letter-spacing="1">DELIVERY / OPERATIONS</text><text x="317" y="32" fill="#6db9ff" font-size="20" text-anchor="middle">&gt;_</text><text x="20" y="73" font-size="17" fill="#e6efff">Docker / Compose / Linux</text><text x="20" y="103" font-size="13" fill="#a4b9d3">GitLab CI / GitHub Actions</text><text x="20" y="133" font-size="13" fill="#a4b9d3">Nginx · DNS · HTTPS</text><text x="20" y="163" font-size="13" fill="#a4b9d3">PHPUnit · Git · Postman</text><text x="20" y="193" font-size="13" fill="#a4b9d3">Kubernetes migration: CI</text><circle cx="180" cy="-18" 